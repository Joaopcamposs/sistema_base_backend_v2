services:
  postgres_test:
    image: postgres:16
    container_name: postgres_test_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:7
    container_name: redis_test
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  test_runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: test_runner
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_healthy
    environment:
      - TEST_ENV=true
      - IN_DOCKER=true
      - DB_HOST=postgres_test
      - PYTHONPATH=/sistema_base_backend_v2
    volumes:
      - .:/sistema_base_backend_v2
    command: pytest tests/ -v --tb=short
