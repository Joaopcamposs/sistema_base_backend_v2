description = "Sistema base para backend de outros sistema de gerenciamento de negocios"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "cryptography>=46.0.3",
    "fastapi[all]>=0.125.0",
    "greenlet>=3.3.0",
    "passlib>=1.7.4",
    "python-jose>=3.5.0",
    "ruff>=0.14.9",
    "sentry-sdk>=2.48.0",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.38.0",
    "validate-docbr>=1.11.1",
]
